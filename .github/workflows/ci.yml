name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 前端构建和检查
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: 安装前端依赖
        run: npm install
        
      - name: 代码检查
        run: npm run lint || true
        
      - name: 构建前端
        run: npm run build
        
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

  # Python 后端检查
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装后端依赖
        run: |
          cd server-python
          pip install -r requirements.txt
          
      - name: 代码检查
        run: |
          cd server-python
          python -c "import main; print('✅ Import check passed')"
